  <style>

    .card {

<script>
  // PHASE19_MARINA_LABEL_FIX: map marinaId -> marina name (avoid array index bugs)
  let marinaNameById = {};
  async function loadMarinaNameMap() {
    try {
      const r = await fetch("/api/marinas");
      const d = await r.json();
      const list = Array.isArray(d) ? d : (d.marinas || []);
      marinaNameById = {};
      for (const m of list) marinaNameById[Number(m.id)] = m.name;
    } catch (e) {
      marinaNameById = {};
    }
  }


  // ---------- Helpers ----------
  function qs(id) { return document.getElementById(id); }

  async function resetDemoFromInbox() {
    const btn = qs("btnInboxReset");
    const oldText = btn ? btn.textContent : "Reset Demo";
    if (!confirm("Reset demo data now? This restores bookings from baseline.")) return;

    try {
      if (btn) {
        btn.disabled = true;
        btn.textContent = "Resetting…";
      }

      let demoAdminKey = "";
      try { demoAdminKey = localStorage.getItem("bmDemoAdminKey") || ""; } catch (e) {}
      if (!demoAdminKey) {
        demoAdminKey = window.prompt("Enter demo admin key");
        if (!demoAdminKey) {
          alert("Reset cancelled (no demo admin key entered).");
          return;
        }
        try { localStorage.setItem("bmDemoAdminKey", demoAdminKey); } catch (e) {}
      }

      const res = await fetch("/api/demo/reset", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-Demo-Admin-Key": demoAdminKey
        },
        body: JSON.stringify({ reason: "operator-inbox-header-reset" })
      });

      const text = await res.text();
      let data = null; try { data = JSON.parse(text); } catch (e) {}

      if (!res.ok) {
        alert("Reset failed (HTTP " + res.status + "). " + ((data && data.message) ? data.message : text));
        return;
      }

      // Clear boatie/browser-side demo state so next walkthrough starts clean
      try { sessionStorage.removeItem("bmSubmitInFlight"); } catch (e) {}
      try { sessionStorage.removeItem("bmSubmittedBookingId"); } catch (e) {}
      try { sessionStorage.removeItem("bmBoatieDraft"); } catch (e) {}
      try { localStorage.removeItem("bmDemoLastSubmittedBookingId"); } catch (e) {}
      try { localStorage.removeItem("bmDemoIdentity"); } catch (e) {}
      try { localStorage.removeItem("bmStableIdentity"); } catch (e) {}
      try { window.__bmSubmitInFlight = false; } catch (e) {}
      try { window.__bmSubmitDone = false; } catch (e) {}
      try { window.__bmSubmittedBookingId = ""; } catch (e) {}

      alert((data && data.message) ? data.message : "Reset complete.");
      location.reload();
    } catch (e) {
      alert("Reset failed (server not reachable).");
    } finally {
      if (btn) {
        btn.disabled = false;
        btn.textContent = oldText;
      }
    }
  }

  const inboxResetBtn = qs("btnInboxReset");
  if (inboxResetBtn) {
    inboxResetBtn.addEventListener("click", resetDemoFromInbox);
  }
  function key(v) {
  // PHASE19_KEY_FIX: stable id keying (prevents marinaId 2/3 collisions)
  if (v === null || v === undefined) return "";
  const n = Number(v);
  if (!Number.isFinite(n)) return String(v).trim();
  return String(n);
  }

        // PHASE19_NOTE: removed auto-show JSON panel block (was referencing 'wrap' before declaration)
    // Phase 11: ensure Toggle Raw JSON always works (even if other handlers change)
    const jsonBtn = qs("btnToggleJson");
    const jsonWrap = qs("jsonWrap");
    if (jsonBtn && jsonWrap) {
      jsonBtn.addEventListener("click", () => {
        jsonWrap.style.display = (jsonWrap.style.display === "none" || jsonWrap.style.display === "") ? "block" : "none";
        const st = qs("jsonToggleStatus");
        if (st) st.textContent = "Raw JSON panel: " + (jsonWrap.style.display === "block" ? "visible" : "hidden");
        if (jsonWrap.style.display === "block") {
          const hasContent = (jsonWrap.innerHTML || "").trim().length > 0;
          if (!hasContent) {
            jsonWrap.innerHTML = "<div class=\"muted\">No JSON captured yet. Click <b>Load Inbox</b> first.</div>";
          }
        }
      });
    }

    function esc(s) {
  // Avoid replaceAll for maximum compatibility
  s = String((s === undefined || s === null) ? "" : s);
  s = s.replace(/&/g, "&amp;");
  s = s.replace(/</g, "&lt;");
  s = s.replace(/>/g, "&gt;");
  s = s.replace(/"/g, "&quot;");
  s = s.replace(/'/g, "&#39;");
  return s;
}

function prefLabel(p) {
  p = String(p || "either").toLowerCase().trim();
  if (p === "berth") return "Berth";
  if (p === "swing") return "Swing Mooring";
  return "Either / Best Available";
}

  // Token: accept multiple keys + handle accidental JSON.stringify storage
  function getToken() {
    var raw =
      localStorage.getItem("token") ||
      localStorage.getItem("operatorToken") ||
      localStorage.getItem("authToken") ||
      localStorage.getItem("accessToken") ||
      "";

    raw = String(raw || "").trim();
    if (!raw) return "";

    // If token was stored via JSON.stringify it may include quotes
    try {
      var parsed = JSON.parse(raw);
      if (typeof parsed === "string") return parsed.trim();
    } catch (e) {
      // ignore
    }
    return raw;
  }

  // Compatibility shim: older code paths still call authToken()
  function authToken() {
    return getToken();
  }
// API base: prefer the textbox if present, otherwise fall back to localStorage, otherwise default.
// NOTE: named apiBaseUrl() to avoid collision with <input id="apiBase"> in Safari.
function apiBaseUrl() {
  var input = qs("apiBase");
  var v = (input && input.value ? input.value : "").trim();

  if (!v) {
    v = (localStorage.getItem("apiBaseUrl") || "").trim();
  }
  if (!v) {
    // same-origin default
    v = "";
  }
  return v.replace(/\/+$/, "");
}

  async function apiGet(path) {
    const base = apiBaseUrl();
    const url = (base ? (base.replace(/\/$/, "") + path) : path);

    const token = getToken();
    const headers = {};

    // Send BOTH header styles (keep compatibility), but ensure Bearer is always correct
    if (token) {
      headers["Authorization"] = "Bearer " + token;
      headers["X-Auth-Token"] = token;
    }

    headers["Content-Type"] = "application/json";

    const res = await fetch(url, { headers });
    const text = await res.text();

    let data = null;
    try { data = JSON.parse(text); } catch (e) {}

    if (!res.ok) {
      const msg = (data && (data.error || data.message)) ? (data.error || data.message) : text;
      throw new Error(`HTTP ${res.status} ${msg}`);
    }

    return data;
  }

  function decisionIntelLabel(intel) {
  if (!intel) return "UNKNOWN";
  if (intel.approvable === true) return "GREEN";

  var c = String(intel.classification || "").toUpperCase();
  if (c.indexOf("RED") >= 0 || c.indexOf("BLOCK") >= 0 || c.indexOf("DECLINE") >= 0) return "RED";
  if (c.indexOf("AMBER") >= 0 || c.indexOf("WARN") >= 0 || c.indexOf("REVIEW") >= 0) return "AMBER";
  if (c.indexOf("GREEN") >= 0 || c.indexOf("OK") >= 0 || c.indexOf("APPROVABLE") >= 0) return "GREEN";

  var s = String(intel.status || "").toUpperCase();
  if (s.indexOf("BLOCK") >= 0 || s.indexOf("DECLINE") >= 0 || s.indexOf("UNSUITABLE") >= 0) return "RED";
  if (s.indexOf("REVIEW") >= 0 || s.indexOf("WARN") >= 0 || s.indexOf("PENDING") >= 0) return "AMBER";
  if (s.indexOf("OK") >= 0 || s.indexOf("APPROVABLE") >= 0 || s.indexOf("PASS") >= 0) return "GREEN";

  return "UNKNOWN";
}

function decisionIntelPillClass(intel) {
  var label = decisionIntelLabel(intel);

  async function loginOperatorAndStoreToken() {
    const base = apiBaseUrl();
    const email = (document.getElementById("loginEmail")?.value || "").trim();
    const password = (document.getElementById("loginPassword")?.value || "").trim();
    const statusEl = document.getElementById("loginStatus");

    if (statusEl) statusEl.textContent = "Logging in…";

    const res = await fetch(base.replace(/\/+$/, "") + "/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password }),
    });

    const text = await res.text();
    let data = null;
    try { data = JSON.parse(text); } catch (e) {}

    if (!res.ok) {
      const msg = (data && (data.error || data.message)) ? (data.error || data.message) : text;
      if (statusEl) statusEl.textContent = `Login failed: HTTP ${res.status} ${msg}`;
      throw new Error(`Login failed: HTTP ${res.status} ${msg}`);
    }

    const token = data?.token ? String(data.token) : "";
    if (!token) {
      if (statusEl) statusEl.textContent = "Login succeeded but no token returned.";
      throw new Error("Login succeeded but no token returned.");
    }

    localStorage.setItem("token", token);
    if (statusEl) statusEl.textContent = `Login OK. Token stored (starts: ${token.slice(0, 12)}…)`;

    return token;
  }
